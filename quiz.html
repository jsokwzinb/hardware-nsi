                </label>
                <label class="radio-label">
                    <input type="radio" name="hardware-quiz" value="faux2"> Le cache du CPU
                </label>
                
                <button type="button" onclick="verifierReponse()">Valider la réponse</button>

            <div id="resultat"></div>
        </div>
